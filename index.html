<!DOCTYPE html>
<html>
<head>
  <title>Dodo Chill 🐍🥪</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0f172a;
      color: white;
      font-family: sans-serif;
      flex-direction: column;
    }
    canvas {
      background: #1e293b;
      border-radius: 12px;
    }
    h1 { margin-bottom: 5px; }
    h3 { margin-top: 0; font-weight: 300; font-size: 14px; color: #cbd5f5; }
    button {
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: #334155;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Dodo Chill 🐍🥪</h1>
<h3 id="subtitle">press any key, dodo</h3>
<h3 id="score">snacks collected: 0</h3>

<canvas id="game" width="400" height="400"></canvas>
<button onclick="toggleRest()">rest mode 🌿</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const grid = 20;
let count = 0;
let started = false;
let restMode = false;
let score = 0;

let snake = {
  x: 160,
  y: 160,
  cells: [],
  maxCells: 4,
  dx: grid,
  dy: 0
};

let food = {
  x: 320,
  y: 320
};

function getRandomInt(min, max) {
  return Math.floor(Math.random() * (max - min)) + min;
}

document.addEventListener("keydown", function(e) {
  started = true;

  if (e.which === 37 && snake.dx === 0) {
    snake.dx = -grid; snake.dy = 0;
  } else if (e.which === 38 && snake.dy === 0) {
    snake.dy = -grid; snake.dx = 0;
  } else if (e.which === 39 && snake.dx === 0) {
    snake.dx = grid; snake.dy = 0;
  } else if (e.which === 40 && snake.dy === 0) {
    snake.dy = grid; snake.dx = 0;
  }
});

function toggleRest() {
  restMode = !restMode;
  document.getElementById("subtitle").innerText = restMode 
    ? "inhale… exhale… slow down 🌿" 
    : "no pressure. just play.";
}

function loop() {
  requestAnimationFrame(loop);

  if (!started) return;

  if (++count < 4 || restMode) return;
  count = 0;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  snake.x += snake.dx;
  snake.y += snake.dy;

  if (snake.x < 0) snake.x = canvas.width - grid;
  else if (snake.x >= canvas.width) snake.x = 0;

  if (snake.y < 0) snake.y = canvas.height - grid;
  else if (snake.y >= canvas.height) snake.y = 0;

  snake.cells.unshift({x: snake.x, y: snake.y});
  if (snake.cells.length > snake.maxCells) snake.cells.pop();

  // 🥪 sandwich
  ctx.font = "18px Arial";
  ctx.fillText("🥪", food.x, food.y + 15);

  ctx.fillStyle = "#22c55e";
  snake.cells.forEach(function(cell, index) {

    ctx.fillRect(cell.x, cell.y, grid-1, grid-1);

    if (cell.x === food.x && cell.y === food.y) {
      snake.maxCells++;
      score++;
      document.getElementById("score").innerText = "snacks collected: " + score;

      food.x = getRandomInt(0, 20) * grid;
      food.y = getRandomInt(0, 20) * grid;

      const msgs = [
        "🥪 snack acquired",
        "small win unlocked ✨",
        "dodo is doing okay 🫶",
        "one step at a time 💛"
      ];
      alert(msgs[Math.floor(Math.random() * msgs.length)]);
    }

    for (let i = index + 1; i < snake.cells.length; i++) {
      if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
        alert("hey dodo… slow down. breathe. you’re okay 🫶");
        snake = {
          x: 160, y: 160, cells: [], maxCells: 4, dx: grid, dy: 0
        };
        score = 0;
        document.getElementById("score").innerText = "snacks collected: 0";
      }
    }
  });
}

requestAnimationFrame(loop);
</script>

</body>
</html>
