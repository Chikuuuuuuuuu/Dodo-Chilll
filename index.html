<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const grid = 21;
let snake = [{x: 210, y: 210}];
let dx = grid;
let dy = 0;
let food = {x: 105, y: 105};

let started = false;
let restMode = false;
let score = 0;
let speed = 240;

let musicOn = false;
const bgm = document.getElementById("bgm");
bgm.volume = 0.3;

let stars = [];

function randomPos() {
  return Math.floor(Math.random() * 20) * grid;
}

document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    started = true;
    document.getElementById("subtitle").innerText = "no pressure. just play.";
  }

  if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -grid; }
  if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = grid; }
  if (e.key === "ArrowLeft" && dx === 0) { dx = -grid; dy = 0; }
  if (e.key === "ArrowRight" && dx === 0) { dx = grid; dy = 0; }
});

function toggleRest() {
  restMode = !restMode;
  document.getElementById("subtitle").innerText =
    restMode ? "inhale… exhale… 🌿" : "no pressure. just play.";
}

// 🎵 FIXED MUSIC
function toggleMusic() {
  if (!musicOn) {
    bgm.currentTime = 0;

    bgm.play().then(() => {
      musicOn = true;

      bgm.volume = 0;
      let fade = setInterval(() => {
        if (bgm.volume < 0.3) {
          bgm.volume += 0.02;
        } else {
          clearInterval(fade);
        }
      }, 100);

    }).catch(() => {
      alert("tap again to enable sound 🌧️");
    });

  } else {
    let fade = setInterval(() => {
      if (bgm.volume > 0.02) {
        bgm.volume -= 0.02;
      } else {
        bgm.pause();
        musicOn = false;
        clearInterval(fade);
      }
    }, 100);
  }
}

// ⭐ FLOATING TEXT (FIXED)
function addStarText(text) {
  if (stars.length > 6) stars.shift();

  stars.push({
    text: text,
    x: Math.random() * 360 + 20,
    y: 380,
    speed: Math.random() * 1 + 0.8,
    alpha: 1
  });
}

function drawStars() {
  for (let i = stars.length - 1; i >= 0; i--) {
    let s = stars[i];

    ctx.fillStyle = "rgba(250,204,21," + s.alpha + ")";
    ctx.font = "14px sans-serif";
    ctx.fillText(s.text, s.x, s.y);

    s.y -= s.speed;
    s.alpha -= 0.02;

    if (s.alpha <= 0) {
      stars.splice(i, 1);
    }
  }
}

function drawGlow(x, y, color) {
  const g = ctx.createRadialGradient(x+10,y+10,2,x+10,y+10,18);
  g.addColorStop(0,color);
  g.addColorStop(1,"transparent");
  ctx.fillStyle = g;
  ctx.fillRect(x-5,y-5,30,30);
}

function gameLoop() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if (!started) {
    ctx.fillStyle="#94a3b8";
    ctx.font="18px sans-serif";
    ctx.fillText("Press SPACE 🐍",140,210);
    requestAnimationFrame(gameLoop);
    return;
  }

  if (restMode) {
    let t = Date.now()/500;
    let size = 40 + Math.sin(t)*20;

    ctx.beginPath();
    ctx.arc(210,210,size,0,Math.PI*2);
    ctx.fillStyle="rgba(34,197,94,0.2)";
    ctx.fill();

    ctx.fillStyle="#94a3b8";
    ctx.fillText("breathe...",170,215);

    requestAnimationFrame(gameLoop);
    return;
  }

  setTimeout(() => requestAnimationFrame(gameLoop), speed);

  let head = {x: snake[0].x + dx, y: snake[0].y + dy};

  if(head.x < 0) head.x = canvas.width - grid;
  if(head.y < 0) head.y = canvas.height - grid;
  if(head.x >= canvas.width) head.x = 0;
  if(head.y >= canvas.height) head.y = 0;

  snake.unshift(head);

  if(head.x === food.x && head.y === food.y){
    score++;
    document.getElementById("score").innerText = "snacks collected: " + score;

    food.x = randomPos();
    food.y = randomPos();

    const msgs = ["tiny win ✨","you're okay 🫶","one step 💛","breathe 🌿"];
    addStarText(msgs[Math.floor(Math.random()*msgs.length)]);
  } else {
    snake.pop();
  }

  for(let i=1;i<snake.length;i++){
    if(head.x === snake[i].x && head.y === snake[i].y){
      snake = [{x:210,y:210}];
      score = 0;
      document.getElementById("score").innerText = "snacks collected: 0";
    }
  }

  drawGlow(food.x,food.y,"rgba(251,191,36,0.6)");
  ctx.font="18px Arial";
  ctx.fillText("🥪",food.x,food.y+16);

  snake.forEach((s,i)=>{
    drawGlow(s.x,s.y,"rgba(34,197,94,0.4)");
    ctx.fillStyle = i===0 ? "#4ade80" : "#22c55e";
    ctx.fillRect(s.x,s.y,grid-2,grid-2);
  });

  drawStars();
}

gameLoop();
</script>
