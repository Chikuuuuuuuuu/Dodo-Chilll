<!DOCTYPE html>
<html>
<head>
  <title>Dodo Chill 🐍🥪</title>
  <style>
    body {
      margin: 0;
      background: #0b1220;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: sans-serif;
      flex-direction: column;
    }

    h1 { margin-bottom: 5px; font-weight: 500; }
    h3 { margin: 2px; font-weight: 300; color: #94a3b8; }

    canvas {
      background: #0f172a;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(59,130,246,0.2);
    }

    button {
      margin-top: 12px;
      padding: 8px 16px;
      border-radius: 10px;
      border: none;
      background: #1e293b;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Dodo Chill 🐍🥪</h1>
<h3 id="subtitle">press SPACE to start</h3>
<h3 id="score">snacks collected: 0</h3>

<canvas id="game" width="420" height="420"></canvas>
<button onclick="toggleRest()">rest mode 🌿</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const grid = 21;
let snake = [{x: 210, y: 210}];
let dx = grid;
let dy = 0;
let food = {x: 105, y: 105};

let started = false;
let restMode = false;
let score = 0;
let speed = 180;

// 💫 floating text
let floatingText = "";
let floatingTimer = 0;

function randomPos() {
  return Math.floor(Math.random() * 20) * grid;
}

document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    started = true;
    document.getElementById("subtitle").innerText = "no pressure. just play.";
  }

  if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -grid; }
  if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = grid; }
  if (e.key === "ArrowLeft" && dx === 0) { dx = -grid; dy = 0; }
  if (e.key === "ArrowRight" && dx === 0) { dx = grid; dy = 0; }
});

function toggleRest() {
  restMode = !restMode;
  document.getElementById("subtitle").innerText =
    restMode ? "inhale… exhale… 🌿" : "no pressure. just play.";
}

function drawGlow(x, y, color) {
  const gradient = ctx.createRadialGradient(x+10, y+10, 2, x+10, y+10, 18);
  gradient.addColorStop(0, color);
  gradient.addColorStop(1, "transparent");
  ctx.fillStyle = gradient;
  ctx.fillRect(x-5, y-5, 30, 30);
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 🌙 start screen
  if (!started) {
    ctx.fillStyle = "#94a3b8";
    ctx.font = "18px sans-serif";
    ctx.fillText("Press SPACE 🐍", 140, 210);
    requestAnimationFrame(gameLoop);
    return;
  }

  // 🌿 rest mode
  if (restMode) {
    let t = Date.now() / 500;
    let size = 40 + Math.sin(t) * 20;

    ctx.beginPath();
    ctx.arc(210, 210, size, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(34,197,94,0.2)";
    ctx.fill();

    ctx.fillStyle = "#94a3b8";
    ctx.fillText("breathe...", 170, 215);

    requestAnimationFrame(gameLoop);
    return;
  }

  setTimeout(() => requestAnimationFrame(gameLoop), speed);

  let head = {x: snake[0].x + dx, y: snake[0].y + dy};

  if (head.x < 0) head.x = canvas.width - grid;
  if (head.y < 0) head.y = canvas.height - grid;
  if (head.x >= canvas.width) head.x = 0;
  if (head.y >= canvas.height) head.y = 0;

  snake.unshift(head);

  // 🥪 eat sandwich
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById("score").innerText = "snacks collected: " + score;

    food.x = randomPos();
    food.y = randomPos();

    const msgs = ["snack +1 🥪", "tiny win ✨", "you're okay 🫶"];
    floatingText = msgs[Math.floor(Math.random()*msgs.length)];
    floatingTimer = 60;
  } else {
    snake.pop();
  }

  // ❌ collision
  for (let i = 1; i < snake.length; i++) {
    if (head.x === snake[i].x && head.y === snake[i].y) {
      snake = [{x: 210, y: 210}];
      score = 0;
      document.getElementById("score").innerText = "snacks collected: 0";
    }
  }

  // 🥪 draw food
  drawGlow(food.x, food.y, "rgba(251,191,36,0.6)");
  ctx.font = "18px Arial";
  ctx.fillText("🥪", food.x, food.y + 16);

  // 🐍 draw snake
  snake.forEach((s, i) => {
    drawGlow(s.x, s.y, "rgba(34,197,94,0.4)");
    ctx.fillStyle = i === 0 ? "#4ade80" : "#22c55e";
    ctx.fillRect(s.x, s.y, grid-2, grid-2);
  });

  // 💫 floating text
  if (floatingTimer > 0) {
    ctx.fillStyle = "#facc15";
    ctx.font = "16px sans-serif";
    ctx.fillText(floatingText, 140, 30);
    floatingTimer--;
  }
}

gameLoop();
</script>

</body>
</html>
